[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "mrx-public-mcp"
version = "0.1.0"
description = "Read-only, source-linked access to MineralRightsXchange.com public guides through MCP"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "MineralRightsXchange"}]
dependencies = ["mcp==2.0.0"]
keywords = ["mcp", "mineral-rights", "royalties", "model-context-protocol"]

[project.urls]
Homepage = "https://mineralrightsxchange.com/"
Repository = "https://github.com/underwriter-MXC/mrx-mcp"
Issues = "https://github.com/underwriter-MXC/mrx-mcp/issues"

[project.scripts]
mrx-mcp = "mrx_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mrx_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "README.md", "LICENSE", "SECURITY.md", "pyproject.toml"]
